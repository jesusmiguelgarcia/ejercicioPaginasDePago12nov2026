<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda de Calcetines</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #2b3a4a;
        margin: 0;
        padding: 0;
        text-align: center;
        justify-content: center;
        align-items: center;
        align-content: center;
        color: white;
      }

      .imagen-producto {
        width: 200px;
        height: auto;
        border-radius: 8px;
      }

      .tarjeta-producto {
        background-color: #1a2530;
        width: 300px;
        height: auto;
        border: 1px solid #4a607a;
        padding: 20px;
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
        margin: 20px auto;
        text-align: center;
        color: white;
        border-radius: 10px;
      }

      .contenedor-productos {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        align-content: center;
      }

      button {
        background-color: #4caf50;
        color: white;
        padding: 10px 20px;
        border: none;
        cursor: pointer;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Tienda de Calcetines</h1>
    <p>Bienvenido a nuestra colección de calcetines.</p>

    <div class="contenedor-productos">
      <div class="tarjeta-producto">
        <h3>Calcetines Estampados</h3>
        <p>Par de calcetines cómodos de algodón, talla única.</p>
        <p>Precio: <strong>$150.00</strong></p>
        <img
          class="imagen-producto"
          src="calcetines.jpg"
          alt="Par de calcetines"
        />
        <h3>Realizar pago</h3>
        <div id="paypal-button"></div>

        <p id="resultado"></p>

        <script src="https://www.paypal.com/sdk/js?client-id=sb¤cy=MXN"></script>

        <script>
          paypal
            .Buttons({
              createOrder: (data, actions) => {
                return actions.order.create({
                  purchase_units: [
                    {
                      description: "Calcetines Estampados",
                      amount: {
                        currency_code: "MXN",
                        value: "150.00",
                      },
                    },
                  ],
                });
              },
              onApprove: (data, actions) => {
                return actions.order.capture().then(function (details) {
                  document.getElementById("resultado").innerHTML =
                    "¡Compra realizada exitosamente!<br>" +
                    "Comprador: " +
                    details.payer.name.given_name +
                    "<br>Orden: " +
                    data.orderID;
                });
              },

              onError: (error) => {
                console.error(error);

                document.getElementById("resultado").innerHTML =
                  "Ocurrió un error al procesar el pago.";
              },
            })
            .render("#paypal-button");
        </script>
      </div>
    </div>
  </body>
</html>
