<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastro Salvaje - Productos</title>
    <style>
        body{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f1ece1;
            color: #1a1a1a;
            margin: 0;
        }
        h1{
            background-color: #3a4226;
            color: #f1ece1;
            margin: 0 0 30px 0;
            padding: 22px;
            border-bottom: 3px solid #e0651a;
        }
        .producto{
            background-color: #ffffff;
            padding: 25px;
            max-width: 350px;
            border-radius: 10px;
            border: 1px solid #d9d3c4;
            margin: auto;
        }
        .precio{
            font-weight: bold;
            color: #e0651a;
            font-size: 25px;
        }
        h3{
            color: #3a4226;
        }
    </style>
</head>

<body>
    <h1>Rastro Salvaje</h1>
    <div class="producto">
        <img src="https://imgs.search.brave.com/zNgsq6huOYuwfl621kOs-kNK3wo1LtoLblmv9vpooxI/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9tZWRp/YS5pc3RvY2twaG90/by5jb20vaWQvMTM2/MTQyMzA3L2VzL2Zv/dG8vbmF2YWphLWRl/bC1laiVDMyVBOXJj/aXRvLXN1aXpvLmpw/Zz9zPTYxMng2MTIm/dz0wJms9MjAmYz16/SXJzaE91V2dYWDZY/ZWhiU0hDeTFxRFhP/RHpEMU9YcjdNY2tm/bjhCTjJRPQ" alt="Navaja fija bushcraft Roble" width="300px">
        <h3>Navaja fija bushcraft Roble</h3>
        <p class="precio">$649 MXN</p>
        <h3>Realizar pago</h3>
        <div id="paypal-button"></div>
        <p id="resultado"></p>

        <script
            src="https://www.paypal.com/sdk/js?client-id=BAA4WxDHA0xCJHLkTgjMGVMeGb5Q_9j0gdkbX-wP2tUp0CI9rYJ8ZnQQ_j60e9hGdbPXspOGFdmwgUZevY&currency=MXN&intent=capture">
            </script>

        <script>
            paypal.Buttons({
                createOrder: function (data, actions) {
                    return actions.order.create({
                        purchase_units: [{
                            description: "Calcetines superpros",
                            amount: {
                                currency_code: "MXN",
                                value: "125.00"
                            }
                        }]
                    });
                },
                onApprove: function (data, actions) {
                    return actions.order.capture().then(function (details) {
                        document.getElementById("resultado").innerHTML =
                            "¡Compra realizada exitosamente!<br>" +
                            "Comprador: " + details.payer.name.given_name +
                            "<br>Orden: " + data.orderID;
                    });
                },
                onError: function (error) {
                    console.error(error);
                    document.getElementById("resultado").innerHTML =
                        "Ocurrió un error al procesar el pago.";
                }
            }).render("#paypal-button");

        </script>
    </div>
</body>

</html>
