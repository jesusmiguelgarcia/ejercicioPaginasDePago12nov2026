<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El merequtengue - Productos</title>
    <style>
        body{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(64, 97, 114);
        }
        .producto{
            background-color: cornsilk;
            padding: 25px;
            max-width: 350px;
            border-radius: 10px;
            margin: auto;
        }
        .precio{
            font-weight: bold;
            color: rgb(59, 73, 85);
            font-size: 25px;
        }
    </style>
</head>

<body>
    <h1>El merequetengue</h1>
    <div class="producto">
        <img src="globos y cortinas.jpg" alt="Decoracion fiesta" width="300px">
        <h3>Accesorios para fiesta</h3>
        <p>Sin globos no hay fiesta</p>
        <p class="precio">$300 MXN</p>
        <h3>Realizar pago</h3>
        <div id="paypal-button"></div>
        <p id="resultado"></p>

        <script
             src="https://www.paypal.com/sdk/js?client-id=AcuixB2SyF8CXXYcNaNAMjMflBptPSz3sUeG0ONiIJ8k43G5q8t3VakYOliP5wiQiMzp6mGCPdGkU-KP&currency=MXN&intent=capture"></script>
            </script>

        <script>
            paypal.Buttons({
                createOrder: function (data, actions) {
                    return actions.order.create({
                        purchase_units: [{
                            description: "globos y cortinas",
                            amount: {
                                currency_code: "MXN",
                                value: "300.00"
                            }
                        }]
                    });
                },
                onApprove: function (data, actions) {
                    return actions.order.capture().then(function (details) {
                        document.getElementById("resultado").innerHTML =
                            "¡Compra realizada exitosamente!<br>" +
                            "Comprador: " + details.payer.name.given_name +
                            "<br>Orden: " + data.orderID;
                    });
                },
                onError: function (error) {
                    console.error(error);
                    document.getElementById("resultado").innerHTML =
                        "Ocurrió un error al procesar el pago.";
                }
            }).render("#paypal-button");

        </script>
    </div>
</body>

</html>
