<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tienda de colision</title>
    <style>
        body{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(79, 220, 255);
        }
        .producto{
            background-color: rgb(49, 127, 163);
            padding: 25px;
            max-width: 350px;
            border-radius: 10px;
            margin: auto;
        }
        .precio{
            font-weight: bold;
            color: rgb(226, 43, 43);
            font-size: 25px;
        }
    </style>
</head>

<body>
    <h1>Vertex Collision</h1>

    <div class="producto">

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_Jq6X5j_52gw_9XxzkWRgTGrlp-Vei6fxWab_8PaKLQ&s=10" alt="parachoque para automovil" width="250px">
        <p>Parachoques para automovil para nissan versa</p>
        <p class="precio">$3500</p>
        <h3>Realizar pago</h3>


        <div id="paypal-button-container">
        </div>

        <p id="resultado"></p>

        <script
            src="https://www.paypal.com/sdk/js?client-id=BAApyfoRcoZObyOOc2pZtdQbuwLPZooZO-tSl7VebXHeYZ0l9ktgZdEO0M0GJ3qfOeYGp8kTWoKB1zlzTI&currency=MXN&intent=capture"></script>
        <script>
            paypal.Buttons({
                createOrder: function (data, actions) {
                    return actions.order.create({
                        purchase_units: [{
                            description: "Parachoque",
                            amount: {
                                currency_code: "MXN",
                                value: "3500.00"
                            }
                        }]
                    });
                },
                onApprove: function (data, actions) {

                    return actions.order.capture().then(function (details) {

                        document.getElementById("resultado").innerHTML =
                            "¡Compra realizada exitosamente!<br>";
                    });

                },

                onError: function (error) {

                    console.error(error);

                    document.getElementById("resultado").innerHTML =
                        "Ocurrió un error al procesar el pago.";

                }
            }).render("#paypal-button-container");
        </script>
    </div>

</body>

</html>
